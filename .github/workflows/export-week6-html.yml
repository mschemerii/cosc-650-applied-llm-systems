name: Export Week 6 executed notebook HTML

on:
  push:
    branches:
      - week6-query-transform-rerank
    paths:
      - .github/workflows/export-week6-html.yml
      - week-06/week6_query_transform_rerank.ipynb

permissions:
  contents: write

jobs:
  export-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: week6-query-transform-rerank

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install nbconvert
        run: python -m pip install --upgrade nbconvert

      - name: Export executed notebook to HTML
        run: |
          jupyter nbconvert \
            --to html \
            week-06/week6_query_transform_rerank.ipynb \
            --output week6_query_transform_rerank_executed.html \
            --output-dir week-06

      - name: Commit HTML export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week-06/week6_query_transform_rerank_executed.html
          if git diff --cached --quiet; then
            echo "HTML export already up to date."
          else
            git commit -m "Add executed Week 6 HTML export"
            git push origin HEAD:week6-query-transform-rerank
          fi
