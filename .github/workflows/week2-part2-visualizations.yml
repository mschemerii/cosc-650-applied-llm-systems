name: Week 2 Part 2 visualization update

on:
  push:
    branches:
      - "week-02/part2-visualizations"

permissions:
  contents: write

jobs:
  update-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install transformers torch numpy matplotlib jupyter nbconvert

      - name: Update Part 2 notebook cells
        run: python scripts/update_week2_part2_visualizations.py

      - name: Execute notebook
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 \
            week-02/week2_sampling_experiment.ipynb

      - name: Regenerate HTML
        run: |
          jupyter nbconvert --to html \
            week-02/week2_sampling_experiment.ipynb \
            --output week2_sampling_experiment.html \
            --output-dir week-02

      - name: Commit generated notebook and HTML
        run: |
          rm .github/workflows/week2-part2-visualizations.yml
          rm scripts/update_week2_part2_visualizations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Week 2 Part 2 sampling visualizations"
          git push origin HEAD:week-02/part2-visualizations
