name: Week 2 notebook cleanup

on:
  push:
    branches:
      - week-02/structure-cleanup

permissions:
  contents: write

jobs:
  clean-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: week-02/structure-cleanup

      - name: Remove unrelated model-assistance references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("week-02/week2_sampling_experiment.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))

          terms = ("chatgpt", "gemini", "ai-use note", "outside assistance")
          for cell in notebook.get("cells", []):
              if cell.get("cell_type") != "markdown":
                  continue
              source = cell.get("source", [])
              cell["source"] = [
                  line for line in source
                  if not any(term in line.lower() for term in terms)
              ]

          path.write_text(
              json.dumps(notebook, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit notebook cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/week2-notebook-cleanup.yml
          git add week-02/week2_sampling_experiment.ipynb
          git commit -m "Keep Week 2 notebook focused on DistilGPT2"
          git push origin HEAD:week-02/structure-cleanup
